name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FaithScroll-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaithScroll-apk
          path: FaithScroll-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FaithScroll v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Built by hand from the Actions tab.' }}
          files: FaithScroll-*.apk
          make_latest: true
