# Runs the real subtitle / AI pipelines on every push and reports what works as annotations.
name: Diagnose

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Network pipelines (streams, captions, audio, AI)
        run: |
          set +e
          gradle :app:testDebugUnitTest --tests 'com.faithscroll.app.DiagnoseTest' --no-daemon > test.log 2>&1
          code=$?
          grep -o 'REPORT: .*' test.log | sed 's/^REPORT: //' > report.txt
          grep -E "^e: |What went wrong|FAILED" -A3 test.log | head -20 >> report.txt
          echo "gradle exit: $code" >> report.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' report.txt | cut -c1-60000)
          echo "::warning title=JVM diagnose::$msg"
          exit 0

  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Subtitle pipeline on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/run-device-test.sh
