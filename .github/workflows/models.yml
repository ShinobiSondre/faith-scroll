name: Mirror speech model
# Copies the open-source Vosk speech model (Apache 2.0) into this repo's releases, so the app can
# download it from GitHub (works behind ad-blocking DNS that blocks alphacephei.com).
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/models.yml"]
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download models
        run: |
          curl -fL -o vosk-model-small-en-us-0.15.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          # NB-Whisper base (National Library of Norway, Apache 2.0) for Norwegian speech
          curl -fL -o nb-whisper-base-q5_0.bin https://huggingface.co/NbAiLab/nb-whisper-base/resolve/main/ggml-model-q5_0.bin
      - name: Publish to the "models" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create models -R ${{ github.repository }} --title "Speech models" --notes "Speech models mirrored for the app: Vosk small English (Apache 2.0) and NB-Whisper base by the National Library of Norway (Apache 2.0)." --latest=false
          gh release upload models vosk-model-small-en-us-0.15.zip nb-whisper-base-q5_0.bin -R ${{ github.repository }} --clobber
