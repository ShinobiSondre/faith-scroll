name: Modern Norwegian New Testament
# Fetches "En Levende Bok – Det Nye Testamentet" (Biblica Open, CC BY-SA 4.0) from eBible.org and
# adds it to the app's assets, so Norwegian New Testament verses read in modern bokmål.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/modern-bible.yml", "tools/build_modern_nt.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          curl -fL -o noblb_vpl.zip https://eBible.org/Scriptures/noblb_vpl.zip
          python3 tools/build_modern_nt.py noblb_vpl.zip app/src/main/assets/bible_no_nt.json.gz
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/bible_no_nt.json.gz
          git commit -m "Add modern Norwegian New Testament (En Levende Bok, CC BY-SA 4.0)" || exit 0
          git push
